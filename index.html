<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Little boat, big pool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="loading">Filling the pool…</div>

    <div id="hud" hidden>
      <div class="row"><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span> Steer</div>
      <div class="row"><span class="keys"><kbd class="wide">Space</kbd></span> Hop</div>
      <div class="row"><span class="keys"><kbd class="wide">Click</kbd></span> Splash or poke</div>
      <div class="row"><span class="keys"><kbd>H</kbd></span> Toot</div>
      <div class="row"><span class="keys"><kbd>M</kbd></span> Mute</div>
    </div>

    <button id="mute" aria-label="Mute sound" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
        <path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <path class="cross" d="M16 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>

    <div id="stick" hidden><div id="knob"></div></div>
    <button id="hop" hidden>Hop</button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
